<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Bienvenido — Gasto Fácil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0456C5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
</head>
<body>
  <main class="main main--auth">
    <section class="auth-card">
      <div class="auth-hero">
        <h1 class="auth-title">Bienvenido a Gasto Fácil</h1>
        <p class="auth-subtitle">Recupera tus gastos en otro dispositivo y protege tu cuenta cuando quieras.</p>
      </div>

      <div class="auth-actions">
        <button id="guestButton" class="btn btn--primary btn--block">Continuar como invitado</button>
        <a href="/login.html" class="btn btn--outline btn--block">Iniciar sesión</a>
      </div>

      <div id="message" class="error-message" style="display:none; margin-top:1rem"></div>
    </section>
  </main>

  <script type="module" src="/js/welcome.js"></script>
  <script src="/js/pwa-register.js" defer></script>
</body>
</html>
